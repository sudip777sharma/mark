spring:
  application:
    name: mark
  datasource:
    url: jdbc:h2:file:./mark-internal/db/markdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
server:
  port: 8081
  address: 127.0.0.1
mark:
  agent:
    max-steps: 30
  browser:
    headless: false
    timeout-ms: 10000
  filesystem:
    base-path: ./mark-workspace
  vision:
    primary-model: mirage
    secondary-model: qwen3-vl
    mirage:
      base-url: "http://localhost:8088/v1"
      model: "mirage"
      timeout-ms: 3000
    qwen:
      base-url: "http://localhost:11434/v1"
      model: "qwen3-vl:2b"
      timeout-ms: 35000
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    dev.mark: DEBUG
