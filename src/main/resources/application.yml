spring:
  application:
    name: mark
  datasource:
    url: jdbc:h2:file:./mark-workspace/db/markdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
server:
  port: 8081
mark:
  agent:
    max-steps: 30
  browser:
    headless: false
    timeout-ms: 10000
  filesystem:
    base-path: ./mark-workspace
  llm:
    active-provider: gemini
    local:
      base-url: "http://127.0.0.1:8080/v1"
      model: "ggml-org/gemma-4-E4B-it-GGUF:Q8_0"
    gemini:
      api-key: "${GEMINI_API_KEY:}"
      model: gemini-3.6-flash
    groq:
      base-url: https://api.groq.com/openai
      api-key: "${GROQ_API_KEY:}"
      model: qwen/qwen3.6-27b
    openrouter:
      base-url: "https://openrouter.ai/api/v1"
      api-key: "${OPENROUTER_API_KEY:}"
      model: "openrouter/free"
    colab:
      base-url: "https://valley-ethnic-fitting-baghdad.trycloudflare.com/v1"
      model: "Qwen/Qwen2.5-VL-7B-Instruct-AWQ"
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    dev.mark: DEBUG


